name: Update source and photos

# One-time helper: neutralizes the default startup greeting in the source,
# rebuilds the single-file build, and adds resized build photos to docs/photos.
# Safe to re-run: it asserts the old text exists before changing anything.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neutralize default greeting
        run: |
          python3 - <<'EOF'
          p = "nexus/main.py"
          s = open(p, encoding="utf-8").read()
          old1 = '# ---- Startup greeting (Science Spark 2026 welcome; 2026-09) ----'
          new1 = '# ---- Startup greeting (spoken welcome; 2026-09) ----'
          old2 = '''શ્રી મુક્તજીવન વિદ્યાલય
          ઈસનપુર તરફથી આપ સૌનું ભાવ ભર્યું સ્વાગત છે.
          આજના આ વિશેષ કાર્યક્રમ Science Spark 2026 બાળકોમાં રહેલ એક જિજ્ઞાસાની ચિંગારી પ્રગટાવવાનું કામ કરશે.
          બાળકોમાં રહેલ આંતરિક શક્તિને ઉજાગર કરવા શ્રી મુક્તજીવન ગ્રુપ ઓફ એડયુકેશન હંમેશા તત્પર છે.
          આવો આજે મુક્ત જિનિયસ ની જિજ્ઞાસાની એક ઝલક જોઈએ."""'''
          new2 = '''હું છું નેક્સસ — એક અવાજ વડે ચાલતો, જાતે બનાવેલો એઆઈ રોબો.
          આપ સૌનું હૃદયપૂર્વક સ્વાગત છે.
          ચાલો, આજે નવું કંઈક શીખીએ અને જોઈએ."""'''
          assert s.count(old1) == 1 and s.count(old2) == 1, "old greeting not found"
          s = s.replace(old1, new1).replace(old2, new2)
          assert "Science Spark" not in s and "મુક્તજીવન" not in s
          open(p, "w", encoding="utf-8").write(s)
          print("greeting neutralized")
          EOF

      - name: Make build script paths portable
        run: |
          python3 - <<'EOF'
          p = "scripts/build_combined.py"
          s = open(p).read()
          old = 'SRC = "/workspace/notes/nexus_package"\nOUT = "/scratch/work/nexus_all_in_one.py"'
          new = ('_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))\n'
                 'SRC = os.environ.get("NEXUS_BUILD_SRC", _ROOT)\n'
                 'OUT = os.environ.get("NEXUS_BUILD_OUT", os.path.join(_ROOT, "nexus_all_in_one.py"))')
          assert s.count(old) == 1
          open(p, "w").write(s.replace(old, new))
          print("build script updated")
          EOF

      - name: Rebuild single-file build
        run: python3 scripts/build_combined.py

      - name: Download and resize photos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/photos /tmp/photos
          gh api -H "Accept: application/octet-stream" /repos/${{ github.repository }}/releases/assets/586445564 > /tmp/photos/display-jumper-wiring.jpg
          gh api -H "Accept: application/octet-stream" /repos/${{ github.repository }}/releases/assets/586445566 > /tmp/photos/display-header-closeup.jpg
          gh api -H "Accept: application/octet-stream" /repos/${{ github.repository }}/releases/assets/586445559 > /tmp/photos/robot-gpio-wiring.jpg
          python3 -m pip install --quiet --disable-pip-version-warning pillow
          python3 - <<'EOF'
          from PIL import Image
          import os
          for name in ["display-jumper-wiring", "display-header-closeup", "robot-gpio-wiring"]:
              im = Image.open(f"/tmp/photos/{name}.jpg").convert("RGB")
              w, h = im.size
              if w > 1400:
                  im = im.resize((1400, int(h * 1400 / w)), Image.LANCZOS)
              im.save(f"docs/photos/{name}.jpg", "JPEG", quality=85, optimize=True)
              print(name, os.path.getsize(f"docs/photos/{name}.jpg") // 1024, "KB")
          EOF

      - name: Verify and commit
        run: |
          grep -q "હૃદયપૂર્વક" nexus/main.py
          if grep -q "Science Spark" nexus/main.py nexus_all_in_one.py; then
            echo "ERROR: event reference still present"; exit 1
          fi
          ls -la docs/photos/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Neutral default greeting; rebuild single-file build; add build photos"
            git push
          fi
