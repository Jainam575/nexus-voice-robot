name: Import source code

# One-time helper: downloads the full source bundle attached to the
# "source-import" release and commits it to the repository.
# Safe to re-run: if the files already exist, nothing is committed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the source bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -H "Accept: application/octet-stream" \
            /repos/${{ github.repository }}/releases/assets/586400893 \
            > /tmp/code.zip
          unzip -q /tmp/code.zip -d /tmp/src
          cp -a /tmp/src/nexus-repo/. .
          rm -rf /tmp/src /tmp/code.zip

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import - files already present."
          else
            git commit -m "Import source: nexus package, tests, single-file build, tools"
            git push
          fi
